name: Push latest
on:
  push:
    branches:
      - develop
jobs:
  build-image:
    name: Build Docker image 🐋
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build and export
      uses: docker/build-push-action@v5
      with:
        context: .
        tags: islasgeci/dimorfismo_py:latest
        outputs: type=docker,dest=/tmp/image.tar
    - name: Upload artifact
      uses: actions/upload-artifact@main
      with:
        name: image
        path: /tmp/image.tar

  test-module:
    name: Test Python module 🐍
    needs: build-image
    runs-on: ubuntu-latest
    env:
      BITBUCKET_USERNAME: ${{ secrets.BITBUCKET_USERNAME }}
      BITBUCKET_PASSWORD: ${{ secrets.BITBUCKET_PASSWORD }}
    steps:
    - name: Copia repositorio
      uses: actions/checkout@main
    - name: Download artifact
      uses: actions/download-artifact@main
      with:
        name: image
        path: /tmp
    - name: Load image
      run: |
        docker load --input /tmp/image.tar
        docker image ls -a
    - name: Verifica el formato
      run: docker run islasgeci/dimorfismo_py:latest make check
    - name: Corre pruebas y evalúa cobertura
      run: docker run --volume $PWD:/workdir islasgeci/dimorfismo_py:latest make coverage
    - name: Upload coverage reports to Codecov with GitHub Action
      uses: codecov/codecov-action@main
      with:
        files: ./coverage.xml
        verbose: true
    - name: Run model 
      run: docker run --volume $PWD:/workdir --env BITBUCKET_USERNAME=$BITBUCKET_USERNAME --env BITBUCKET_PASSWORD=$BITBUCKET_PASSWORD islasgeci/dimorfismo_py:latest bash -c "make install && make data/processed/model_parameters.json"
    - name: Create/Update tag
      uses: rickstaa/action-create-tag@v1.5.4
      with:
        tag: "latest"
        message: "Latest release"
        force_push_tag: true
    - name: Docker log-in
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
    - name: Sube latest a Docker Hub
      run: docker push islasgeci/dimorfismo_py:latest
    - name: Sube sha a Docker Hub
      run: docker push islasgeci/dimorfismo_py:${GITHUB_SHA:0:4}
    - uses: geekyeggo/delete-artifact@v5
      with:
          name: image

  mutants:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
    - name: Copia repositorio
      uses: actions/checkout@main
    - name: Download artifact
      uses: actions/download-artifact@main
      with:
        name: image
        path: /tmp
    - name: Load image
      run: |
        docker load --input /tmp/image.tar
        docker image ls -a
    - name: Corre mutantes
      run: docker run --volume $PWD:/workdir islasgeci/dimorfismo_py:latest make mutants

  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    needs: test-module
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
    - name: Set up Python 3.X
      uses: actions/setup-python@main
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: >-
        python -m
        build
        --sdist
        --wheel
        --outdir dist/
        .
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_TOKEN }}
        skip-existing: true
